# Tribo LiDAR self-filtering config (laser_filters)
# - Input  : /scan (from your LiDAR driver)
# - Output : /scan_filtered (use this for slam_toolbox + nav2)
#
# Run example:
#   ros2 run laser_filters scan_to_scan_filter_chain --ros-args \
#     --params-file <this_file.yaml> \
#     -r scan:=/scan \
#     -r scan_filtered:=/scan_filtered
#
# Notes:
# - BoxFilter removes returns inside a cartesian box expressed in `box_frame` (here: base_link).
# - Ensure TF exists: base_link <-> <scan frame_id> (e.g., laser_link).
/**:
  ros__parameters:
    # Optional: make internal TF message filter wait for transforms to this frame.
    # tf_message_filter_target_frame: base_link

    filter1:
      name: box_self
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        # 박스 안의 점 = 로봇 자기 구조물(기둥 + 상단 payload 프레임)이므로 버린다.
        # 값은 base_link 좌표. 아래는 실측(라이다 근접 고정점 스윕, 2026-07-15)에
        # 여유 7cm 를 준 것이며, 요청 사양(전10/후40/좌우30)이 아니라 실측을 따른다.
        #
        # ⚠ 실측 자기 구조물 경계: base_link x[-0.11, +0.28], y[±0.32]
        #   = 라이다(x=0.16) 기준 전방 0.12 / 후방 0.27 / 좌우 0.32.
        #   payload 프레임이 넓어 좌우가 0.32, 전방이 0.12 까지 나온다.
        #   요청값(전방0.10, 좌우0.30)으로는 자기 몸이 박스 밖으로 삐져나가
        #   /scan_filtered 에 자기 구조물이 남는다(코스트맵 네 모서리에 검은 셀).
        #
        # ⚠ 박스를 좁히면 자기 몸이 안 걸러지고, 넓히면 그만큼 진짜 장애물도
        #   지운다. 전방/좌우는 실측 경계 + 여유 7cm, 후방(min_x)은 사용자 요청으로
        #   추가 확대.
        #   → 로봇 중심에서 전방 35 / 후방 40 / 좌우 39 cm 이내 점을 전부 지우므로,
        #     벽·장애물에 그보다 가까이 붙으면 그 점도 코스트맵에서 사라진다.
        #     후방은 크게 잡아도 주로 전진 주행이라 무해(뒤쪽은 회전하며 앞으로 봄).
        #
        # ⚠ box_frame 을 laser_link 로 바꾸지 말 것. laser_link 는 yaw=pi 로 180도
        #   뒤집혀 있어(실로봇 역방향 마운트 보정) +x 가 로봇 뒤를 가리킨다.
        #   전/후방이 뒤집힌 채 필터링된다.
        min_x: -0.40   # 후방: 실측 -0.11 크게 초과 (라이다 후방 56cm, 사용자 요청 확대)
        max_x:  0.35   # 전방: 실측 +0.28 + 7cm
        min_y: -0.39   # 우:   실측 -0.32 + 7cm
        max_y:  0.39   # 좌:   실측 +0.32 + 7cm
        # 2D 스캔이라 z 는 넉넉히 (라이다 평면 z=0.17 부근)
        min_z: -0.50
        max_z:  0.50
