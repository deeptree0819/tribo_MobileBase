# tribo_bringup (hardware + teleop interface)
tribo_bringup:
  ros__parameters:
    # Serial — port is set by bringup.launch.py (resolved udev /dev/tribo_base, or
    # by-id fallback). Left unset here so the launch value is authoritative; for a
    # standalone `ros2 run`, the node default (base by-id) applies.
    baudrate: 115200
    car_type: 1

    # Motion interface
    use_motion_mode: false
    max_lin_vel: 0.50
    max_ang_vel: 2.00
    turn_scale: 1.00

    # Differential approximation
    # (track_width comes from robot_geom.yaml)

    # cmd_vel safety
    vx_deadzone: 0.02
    wz_deadzone: 0.05
    cmd_timeout: 0.50

    # cmd_vel direction (verified on robot 2026-06-08, motors m1~m4 correctly wired):
    #   invert_cmd_vel=true        -> teleop forward = robot forward
    #   invert_cmd_vel_angular=true -> teleop left = robot left
    invert_cmd_vel: true
    invert_cmd_vel_angular: true

    # Per-motor calibration
    gain_m1: 1.000   # FL
    gain_m2: 0.977   # RL
    gain_m3: 0.78  # RR
    gain_m4: 0.73   # FR

    # Reverse-direction (backward) extra factors
    gain_left_rev_factor: 1.00
    gain_right_rev_factor: 1.00

    # Per-motor direction invert (use ONLY if a wheel spins backward for +cmd_vel)
    invert_m1: false
    invert_m2: false
    invert_m3: false
    invert_m4: false

    # Minimum PWM to overcome static friction (0~100)
    pwm_min_percent: 35.0

    # Rotation-only PWM boost (skid-steer lateral scrub friction stalls in-place turns).
    # Applied ONLY when |wz| (after turn_scale) >= rotate_wz_threshold; pure straight
    # driving keeps pwm_min_percent (no effect). Tuned on-floor 2026-06-15.
    rotate_pwm_min: 45.0          # min PWM duty (%) for wheels contributing to rotation
    rotate_wz_threshold: 0.10     # rad/s; |wz| above this is treated as a turn

    # In-place rotation linearization (inverse-affine).
    # Open-loop PWM response is affine, not proportional:
    #   actual_wz ~= rot_lin_offset + rot_lin_slope * internal_wz
    # The offset is the floor (rotate_pwm_min) imposing a MINIMUM spin rate, which is why
    # turn_scale (a pure gain) cannot fix tracking. We invert the fit instead.
    # ⚠️ PER-ROBOT: these were measured on tribo v2. Re-measure per robot and override in
    #    config/motor_calib.yaml (gitignored), same as gain_m*.
    # Measure: sweep `ros2 run tribo_odom rotation_calib -p angular_speed:=<w>` and fit
    #    actual vs commanded. Battery must be >11V or the fit is garbage.
    rot_lin_enable: true
    rot_lin_offset: 0.186         # rad/s — minimum achievable spin (PWM floor)
    rot_lin_slope: 0.216
    rot_lin_max_wz: 0.55          # rad/s — measured ceiling is ~0.6; stay under it
    rot_lin_vx_max: 0.02          # only linearize when |vx| <= this (in-place spin)

    # Debug / telemetry
    debug_hw: false
    debug_tx: false
    debug_enc_speed: false
    debug_enc_period: 1.0

    publish_wheel_speed: true
    publish_wheel_delta: true

    # IMU (board 9-axis -> sensor_msgs/Imu on /imu/data)
    publish_imu: true
    imu_topic: "imu/data"
    imu_frame: "base_link"
    imu_rate: 50.0
    invert_imu_yaw: true    # board gz spins opposite to encoder odom (verified 2026-06-11)

    # Battery (board voltage -> sensor_msgs/BatteryState on /battery)
    publish_battery: true
    battery_topic: "battery"
    battery_rate: 1.0
    battery_full_v: 12.6    # 3S full
    battery_empty_v: 9.0    # 3S empty (0%)
    battery_warn_v: 10.5    # low-battery warning threshold
