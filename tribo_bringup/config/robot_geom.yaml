# Robot geometry: edit these FIRST when hardware changes.
# Units: meters, ticks
# NOTE: track_width = PHYSICAL distance between left/right driven wheel centers (measured 0.52 m).
#       Used by tribo_bringup forward kinematics (cmd_vel -> wheel speeds).
#       tribo_odom uses a LARGER *effective* track (slip-calibrated) set in odom.yaml / launch.
# NOTE: wheel_radius = wheel diameter / 2. (verified by 1 m straight-drive calibration)
# NOTE: ticks_per_rev = encoder ticks per one wheel revolution (after gearbox if encoder is on motor shaft, adjust accordingly).
/**:
  ros__parameters:
    # 2026-07-29 실측 0.71 (좌우 바퀴 중심거리). 기존 0.52 는 오기였다 —
    # bringup.launch.py 주석은 같은 값을 "physical 0.70 m" 라 적어 리포 안에서
    # 모순이었고, 실측이 0.70 쪽을 확인해줬다. 메카넘 교체로 바뀐 게 아니다
    # (바퀴만 갈아서 19cm 가 늘 수는 없다) → 고무바퀴로 되돌려도 0.71 이 맞다.
    # ⚠️ 과소 track 은 정기구학에서 wz 를 그대로 깎는다(v=vx±wz·track/2).
    #    0.52/0.71=0.73 배, 즉 명령 wz 의 73% 만 돌고 있었다. turn_scale·rot_lin·
    #    rotate_pwm_min 상향으로 덧대던 회전 문제의 상당 부분이 여기서 왔을 수 있다.
    track_width: 0.71
    # 실측 2026-07-16 (기체 7b6a, 라이다 벽거리 vs odom): 0.040 은 12% 과소였다.
    # 전진 실제/odom=1.117, 후진 1.124 (방향 일치) → 0.040 × 1.121 = 0.0448.
    # 바퀴는 기체별이 아니라 모델 공통이므로 공유값으로 둔다.
    # ⚠️ wheel_radius 와 ticks_per_rev 는 곱으로만 작용(거리=ticks/tpr×2πR)하므로
    #    둘 중 어느 쪽이 틀려도 같은 증상이다. 여기서는 R 로 흡수했다.
    #
    # 2026-07-29 실측 82mm 메카넘(기체 76c02a)으로 교체 후 직진 재캘리브.
    # 1.6m 명령 주행(정지 활주 포함 odom 1.8199m) vs 줄자 실측 1.7m → ×0.9341.
    #   0.0460(시작값) × 0.9341 = 0.0430.
    # 새 보정계수는 공칭 0.041 대비 ×1.049 로, 고무바퀴 때의 ×1.121 과 다르다.
    # 순수 ticks_per_rev 오차였다면 같아야 하므로, 구 0.0448 에는 기체 편차가
    # 섞여 있었다고 본다(그 값은 다른 기체 7b6a 에서 라이다 벽거리로 측정).
    # ⚠️ 따라서 이 값은 "모델 공통"이 아닐 수 있다. 다른 기체는 재측정할 것.
    # ⚠️ 줄자 눈측정 ±5cm → R 은 ±2.8%(0.0417~0.0442). 이 이상 자릿수는 무의미.
    wheel_radius: 0.0430
    ticks_per_rev: 4320
