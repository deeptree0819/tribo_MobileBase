# robot_localization EKF for Tribo MobileBase
#   Inputs:  /odom_raw (encoder odom from tribo_odom)  +  /imu/data (board 9-axis IMU from tribo_bringup)
#   Outputs: /odom (remapped from odometry/filtered in launch)  +  TF odom->base_link
#
# Node name must match the launch (name="ekf_node").
# Config mask order (15 bool): x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
ekf_node:
  ros__parameters:
    frequency: 20.0           # Pi5에서 Nav2 동시구동 시 30Hz도 CPU 포화 순간 'Failed to meet update rate'
                              # (한 업데이트 0.32s까지 측정). 20Hz로 낮춰 부담 완화. 차동구동 실내엔 충분.
    sensor_timeout: 0.1        # 20Hz 주기(50ms)보다 약간 큰 적정값. 입력 센서(IMU 50Hz/odom_raw) 끊김 판정용.
    two_d_mode: true            # 평면 로봇 → z, roll, pitch, vz/vroll/vpitch 강제 0
    publish_tf: true            # EKF가 odom->base_link TF 발행 (odom_publisher TF는 use_ekf=true일 때 끔)
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # GPS 없으므로 odom 기준 (map은 SLAM 띄울 때 자동 연결)

    # ----- 엔코더 오도메트리 -----
    # 회전(yaw/vyaw)은 휠에서 끔: 4륜 스키드라 제자리/급회전 시 바퀴가 헛돌아
    # 휠 odom yaw가 실제보다 과대적분됨(실측 2026-06-11, 슬립 변동 큼). 회전은 IMU 자이로(vyaw)로.
    odom0: /odom_raw
    odom0_config: [true,  true,  false,    # x, y     사용 (z 미사용)
                   false, false, false,    # yaw      미사용 (슬립 → IMU vyaw로 대체)
                   true,  true,  false,    # vx, vy   사용 (vz 미사용)
                   false, false, false,    # vyaw     미사용 (슬립 → IMU vyaw로 대체)
                   false, false, false]    # 가속도 미사용
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ----- 보드 IMU (자이로만 사용) -----
    # 주의: 보드 펌웨어가 REPORT_IMU_ATT의 yaw payload를 갱신하지 않음 (freeze) → orientation.yaw 사용 금지.
    # gz는 정상 변동하므로 vyaw로만 yaw 추정. roll/pitch는 평면 로봇이라 two_d_mode가 어차피 무시.
    imu0: /imu/data
    imu0_config: [false, false, false,     # 위치 미사용
                  false, false, false,     # orientation 미사용 (yaw freeze, roll/pitch는 평면이라 불필요)
                  false, false, false,     # 선속도 미사용
                  false, false, true,      # vyaw(gz)만 사용
                  false, false, false]     # 가속도 미사용
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
    imu0_differential: false
    imu0_relative: false
