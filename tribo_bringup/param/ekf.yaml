# robot_localization EKF for Tribo MobileBase
#   Inputs:  /odom_raw (encoder odom from tribo_odom)  +  /imu/data (board 9-axis IMU from tribo_bringup)
#   Outputs: /odom (remapped from odometry/filtered in launch)  +  TF odom->base_link
#
# Node name must match the launch (name="ekf_node").
# Config mask order (15 bool): x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
ekf_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true            # 평면 로봇 → z, roll, pitch, vz/vroll/vpitch 강제 0
    publish_tf: true            # EKF가 odom->base_link TF 발행 (odom_publisher TF는 use_ekf=true일 때 끔)
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # GPS 없으므로 odom 기준 (map은 SLAM 띄울 때 자동 연결)

    # ----- 엔코더 오도메트리 -----
    odom0: /odom_raw
    odom0_config: [true,  true,  false,    # x, y     사용 (z 미사용)
                   false, false, true,     # yaw      사용 (roll/pitch 미사용)
                   true,  true,  false,    # vx, vy   사용 (vz 미사용)
                   false, false, true,     # vyaw     사용
                   false, false, false]    # 가속도 미사용
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # ----- 보드 IMU (자세 융합값 + 자이로) -----
    imu0: /imu/data
    imu0_config: [false, false, false,     # 위치 미사용
                  true,  true,  true,      # roll/pitch/yaw orientation 사용
                  false, false, false,     # 선속도 미사용
                  true,  true,  true,      # vroll/vpitch/vyaw 사용
                  false, false, false]     # 가속도 미사용 (bringup에서 큰 공분산으로 무력화)
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
    imu0_differential: false
    imu0_relative: false
